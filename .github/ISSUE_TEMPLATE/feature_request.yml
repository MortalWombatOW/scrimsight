name: "Feature request"
description: Suggest an enhancement or new capability.
title: "[feat]: "
labels: ["feat", "inbox"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Please check the existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: "The problem"
      description: "Briefly describe *why* this feature is needed."
      placeholder: |
        "When I try to ..., I cannot ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
      placeholder: |
        "Add a CLI flag that ..."
      validations:
        required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "P0 – must have"
        - "P1 – nice to have"
        - "P2 – future idea"
    validations:
      required: true
